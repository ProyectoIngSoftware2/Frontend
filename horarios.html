<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios y Bloqueos | Punto y Sal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="componentes.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar__brand">Punto y Sal</div>
    <div class="navbar__user" id="userInfo"></div>
    <div class="navbar__actions">
      <button class="btn btn--danger" id="logoutBtn">Cerrar sesión</button>
    </div>
  </nav>

  <div class="card">
    <div class="card__header">
      <div>
        <h2 class="card__title">Horarios y Bloqueos</h2>
        <p class="card__subtitle">Solo administrador</p>
      </div>
    </div>

    <div id="errorMsg" class="error hidden" role="alert"></div>
    <div id="successMsg" class="success hidden" role="status"></div>

    <!-- ===== Horarios ===== -->
    <h3 class="section-title" id="horarioFormTitle">Configurar horario operativo</h3>
    <form id="horarioForm" class="form-grid" novalidate>
      <div class="field">
        <label class="field__label" for="dia">Día de semana</label>
        <select id="dia" class="field__input" required>
          <option value="1">Lunes</option>
          <option value="2">Martes</option>
          <option value="3">Miércoles</option>
          <option value="4">Jueves</option>
          <option value="5">Viernes</option>
          <option value="6">Sábado</option>
          <option value="7">Domingo</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="apertura">Apertura</label>
        <input type="time" id="apertura" class="field__input" required>
      </div>
      <div class="field">
        <label class="field__label" for="cierre">Cierre</label>
        <input type="time" id="cierre" class="field__input" required>
      </div>
      <div class="field">
        <label class="field__label" for="intervalo">Intervalo (min)</label>
        <input type="number" id="intervalo" class="field__input" value="30" min="1" max="1440" step="1" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn--primary" id="horarioSubmit">Guardar horario</button>
        <button type="button" class="btn btn--secondary hidden" id="horarioCancel">Cancelar</button>
      </div>
    </form>
    <input type="hidden" id="editHorarioId">

    <h3 class="section-title">Horarios configurados</h3>
    <div class="table-wrap">
      <table id="horariosTable">
        <thead>
          <tr><th>Día</th><th>Apertura</th><th>Cierre</th><th>Intervalo</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="horariosTbody"></tbody>
      </table>
    </div>

    <!-- ===== Bloqueos ===== -->
    <h3 class="section-title" id="bloqueoFormTitle">Registrar bloqueo</h3>
    <form id="bloqueoForm" class="form-grid" novalidate>
      <div class="field">
        <label class="field__label" for="mesaId">Mesa</label>
        <select id="mesaId" class="field__input">
          <option value="">Todas las mesas (general)</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="inicio">Inicio</label>
        <input type="datetime-local" id="inicio" class="field__input" required>
      </div>
      <div class="field">
        <label class="field__label" for="fin">Fin</label>
        <input type="datetime-local" id="fin" class="field__input" required>
      </div>
      <div class="field">
        <label class="field__label" for="motivo">Motivo</label>
        <input type="text" id="motivo" class="field__input" placeholder="Mantenimiento, evento privado..." maxlength="180" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn--primary" id="bloqueoSubmit">Crear bloqueo</button>
        <button type="button" class="btn btn--secondary hidden" id="bloqueoCancel">Cancelar</button>
      </div>
    </form>
    <input type="hidden" id="editBloqueoId">

    <h3 class="section-title">Bloqueos registrados</h3>
    <div class="table-wrap">
      <table id="bloqueosTable">
        <thead>
          <tr><th>Mesa</th><th>Inicio</th><th>Fin</th><th>Motivo</th><th>Acciones</th></tr>
        </thead>
        <tbody id="bloqueosTbody"></tbody>
      </table>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="horarios.js"></script>
</body>
</html>
