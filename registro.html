<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | Punto y Sal</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login">
    <section class="login__card">
      <header class="login__brand">
        <h1 class="login__title">Punto <span>y</span> Sal</h1>
        <p class="login__subtitle">Crea tu cuenta para reservar</p>
      </header>

      <form class="login__form" id="formRegistro" novalidate>
        <div class="field">
          <label class="field__label" for="nombre">Nombre completo</label>
          <input class="field__input" id="nombre" type="text" maxlength="120" autocomplete="name" placeholder="Tu nombre y apellido">
        </div>

        <div class="field">
          <label class="field__label" for="correo">Correo</label>
          <input class="field__input" id="correo" type="email" maxlength="254" autocomplete="email" placeholder="Ingresa tu correo">
        </div>

        <div class="field">
          <label class="field__label" for="telefono">Teléfono</label>
          <input class="field__input" id="telefono" type="tel" maxlength="30" autocomplete="tel" placeholder="+504 9999-0000">
        </div>

        <div class="field">
          <label class="field__label" for="identidad">Número de identidad (opcional)</label>
          <input class="field__input" id="identidad" type="text" maxlength="30" placeholder="0801199000123">
        </div>

        <div class="field">
          <label class="field__label" for="password">Contraseña</label>
          <div class="field__wrap">
            <input class="field__input" id="password" type="password" maxlength="72" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
            <button class="field__toggle" type="button" id="togglePassword" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </div>

        <p class="login__error is-hidden" role="alert"></p>

        <button class="btn btn--primary" type="submit">Crear cuenta</button>
      </form>

      <p class="login__alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>

      <footer class="login__footer">© 2026 Punto y Sal</footer>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
