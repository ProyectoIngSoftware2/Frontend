<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservar Mesa | Punto y Sal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar__brand">Punto y Sal</div>
    <div class="navbar__user" id="userInfo"></div>
    <div class="navbar__actions">
      <button class="btn btn--danger" id="logoutBtn">Cerrar sesión</button>
    </div>
  </nav>

  <div class="card">
    <div class="card__header">
      <div>
        <h2 class="card__title">Solicitar Reserva</h2>
        <p class="card__title">Cliente</p>
      </div>
    </div>

    <div id="errorMsg" class="error hidden"></div>
    <div id="successMsg" class="success hidden"></div>

    <form id="reservaForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <div class="field">
        <label class="field__label" for="fechaHora">Fecha y hora</label>
        <input type="datetime-local" id="fechaHora" class="field__input" required>
      </div>
      <div class="field">
        <label class="field__label" for="personas">Cantidad de personas</label>
        <input type="number" id="personas" class="field__input" value="2" min="1" max="20" required>
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label class="field__label" for="observaciones">Observaciones</label>
        <textarea id="observaciones" class="field__input" rows="3" placeholder="Preferencias o notas (opcional)"></textarea>
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label class="field__label" style="display:block; margin-bottom:6px; color:var(--text-muted); font-weight:600;">Platillos (opcional)</label>
        <div id="platillosContainer" style="border:1px solid var(--card-border); border-radius:var(--radius); padding:12px; background:var(--bg-mid);">
          <p style="color:var(--text-muted); font-size:0.9rem;">Agrega platillos a tu reserva</p>
          <div id="platillosList"></div>
          <button type="button" class="btn btn--secondary" id="addPlatilloBtn" style="margin-top:10px; width:auto; padding:8px 16px; font-size:0.85rem;">+ Agregar platillo</button>
        </div>
      </div>
      <div style="grid-column: 1 / -1;">
        <button type="submit" class="btn btn--primary" id="submitReserva">Solicitar reserva</button>
      </div>
    </form>
  </div>

  <script src="reservar.js"></script>
</body>
</html>
