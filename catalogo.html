<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Punto y Sal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="componentes.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar__brand">Punto y Sal</div>
    <div class="navbar__user" id="userInfo"></div>
    <div class="navbar__actions">
      <button class="btn btn--danger" id="logoutBtn">Cerrar sesión</button>
    </div>
  </nav>

  <div class="card">
    <div class="card__header">
      <div>
        <h2 class="card__title">Catálogo</h2>
        <p class="card__subtitle" id="subtitulo">Mesas y platillos del restaurante</p>
      </div>
    </div>

    <div id="errorMsg" class="error hidden" role="alert"></div>
    <div id="successMsg" class="success hidden" role="status"></div>

    <!-- ===== Mesas ===== -->
    <h3 class="section-title solo-admin" id="mesaFormTitle">Nueva mesa</h3>
    <form id="mesaForm" class="form-grid solo-admin" novalidate>
      <div class="field">
        <label class="field__label" for="numeroMesa">Número o nombre</label>
        <input type="text" id="numeroMesa" class="field__input" placeholder="Ej. 5, VIP, Terraza 2" maxlength="20" required>
      </div>
      <div class="field">
        <label class="field__label" for="capacidad">Capacidad</label>
        <input type="number" id="capacidad" class="field__input" min="1" step="1" placeholder="Personas" required>
      </div>
      <div class="field">
        <label class="field__label" for="ubicacion">Ubicación (opcional)</label>
        <input type="text" id="ubicacion" class="field__input" placeholder="Salón, terraza..." maxlength="100">
      </div>
      <div class="field">
        <label class="field__label" for="estadoMesa">Estado</label>
        <select id="estadoMesa" class="field__input">
          <option value="disponible">Disponible</option>
          <option value="mantenimiento">Mantenimiento</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn--primary" id="mesaSubmit">Crear mesa</button>
        <button type="button" class="btn btn--secondary hidden" id="mesaCancel">Cancelar</button>
      </div>
    </form>
    <input type="hidden" id="editMesaId">

    <h3 class="section-title">Mesas</h3>
    <div class="table-wrap">
      <table id="mesasTable">
        <thead>
          <tr><th>Mesa</th><th>Capacidad</th><th>Ubicación</th><th>Estado</th><th class="solo-admin">Activa</th><th class="solo-admin">Acciones</th></tr>
        </thead>
        <tbody id="mesasTbody"></tbody>
      </table>
    </div>

    <!-- ===== Platillos ===== -->
    <h3 class="section-title solo-admin" id="platilloFormTitle">Nuevo platillo</h3>
    <form id="platilloForm" class="form-grid solo-admin" novalidate>
      <div class="field">
        <label class="field__label" for="nombrePlatillo">Nombre</label>
        <input type="text" id="nombrePlatillo" class="field__input" placeholder="Nombre del platillo" maxlength="120" required>
      </div>
      <div class="field">
        <label class="field__label" for="descripcion">Descripción (opcional)</label>
        <input type="text" id="descripcion" class="field__input" placeholder="Ingredientes, porción..." maxlength="1000">
      </div>
      <div class="field">
        <label class="field__label" for="precio">Precio (L)</label>
        <input type="number" id="precio" class="field__input" min="0" step="0.01" placeholder="0.00" required>
      </div>
      <div class="field field--check">
        <input type="checkbox" id="disponible" checked>
        <label class="field__label" for="disponible">Disponible</label>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn--primary" id="platilloSubmit">Crear platillo</button>
        <button type="button" class="btn btn--secondary hidden" id="platilloCancel">Cancelar</button>
      </div>
    </form>
    <input type="hidden" id="editPlatilloId">

    <h3 class="section-title">Platillos</h3>
    <div class="table-wrap">
      <table id="platillosTable">
        <thead>
          <tr><th>Platillo</th><th>Descripción</th><th>Precio</th><th>Disponibilidad</th><th class="solo-admin">Acciones</th></tr>
        </thead>
        <tbody id="platillosTbody"></tbody>
      </table>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="catalogo.js"></script>
</body>
</html>
